<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edificio — Listaro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="nav">
  <a class="marca" href="index.html"><span class="marca-punto"></span> Listaro</a>
  <div class="nav-acciones"></div>
</header>

<main class="app">

  <nav class="migas">
    <a href="panel.html">Mis edificios</a>
    <span>/</span>
    <span id="ed-miga"></span>
  </nav>

  <div class="app-cabecera">
    <div>
      <h1 id="ed-titulo"></h1>
      <p class="sub" id="ed-direccion"></p>
    </div>
    <button class="btn btn-naranja" data-abrir="modal-habitacion">Nueva habitación</button>
  </div>

  <div id="lista-habitaciones"></div>
</main>

<div class="modal" id="modal-habitacion" hidden>
  <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="t-hab">
    <h3 id="t-hab">Nueva habitación</h3>
    <form id="form-habitacion">
      <label for="h-nombre">Nombre</label>
      <input id="h-nombre" name="nombre" placeholder="Habitación 101" required>

      <label for="h-piso">Piso</label>
      <input id="h-piso" name="piso" placeholder="1">

      <label for="h-estado">Estado</label>
      <select id="h-estado" name="estado">
        <option value="activa">Activa</option>
        <option value="mantenimiento">En mantenimiento</option>
        <option value="cerrada">Cerrada</option>
      </select>

      <div class="modal-acciones">
        <button type="button" class="btn btn-fantasma" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn-naranja">Guardar habitación</button>
      </div>
    </form>
  </div>
</div>

<div id="aviso" class="aviso" role="status" aria-live="polite"></div>
<script src="js/datos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
