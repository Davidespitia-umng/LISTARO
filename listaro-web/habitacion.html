<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habitación — Listaro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="nav">
  <a class="marca" href="index.html"><span class="marca-punto"></span> Listaro</a>
  <div class="nav-acciones"></div>
</header>

<main class="app">

  <nav class="migas">
    <a href="panel.html">Mis edificios</a>
    <span>/</span>
    <a id="h-miga-edificio" href="panel.html"></a>
    <span>/</span>
    <span id="h-miga"></span>
  </nav>

  <div class="app-cabecera">
    <div>
      <h1 id="h-titulo"></h1>
      <p class="sub" id="h-sub"></p>
    </div>
    <button class="btn btn-naranja" data-abrir="modal-item">Agregar artículo</button>
  </div>

  <div class="tabla-envoltura" id="zona-tabla" hidden>
    <table class="tabla">
      <thead>
        <tr>
          <th>Artículo</th><th>Categoría</th><th>Cantidad</th>
          <th>Mínimo</th><th>Estado</th><th>Movimiento</th><th></th>
        </tr>
      </thead>
      <tbody id="cuerpo-items"></tbody>
    </table>
  </div>

  <div class="vacio" id="zona-vacia" hidden>
    <h3>Esta habitación está vacía</h3>
    <p>Agrega el primer artículo para empezar a contar entradas y salidas.</p>
    <button class="btn btn-naranja" data-abrir="modal-item">Agregar artículo</button>
  </div>

  <section class="historial" id="historial" hidden>
    <h2>Movimientos recientes</h2>
    <ul id="lista-movimientos"></ul>
  </section>
</main>

<div class="modal" id="modal-item" hidden>
  <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="t-item">
    <h3 id="t-item">Agregar artículo</h3>
    <form id="form-item">
      <label for="i-nombre">Nombre</label>
      <input id="i-nombre" name="nombre" placeholder="Toallas" required>

      <label for="i-categoria">Categoría</label>
      <input id="i-categoria" name="categoria" placeholder="Lencería">

      <div class="fila-doble">
        <div>
          <label for="i-cantidad">Cantidad</label>
          <input id="i-cantidad" name="cantidad" type="number" min="0" value="0">
        </div>
        <div>
          <label for="i-minimo">Mínimo</label>
          <input id="i-minimo" name="minimo" type="number" min="0" value="0">
        </div>
      </div>

      <label for="i-estado">Estado</label>
      <select id="i-estado" name="estado">
        <option value="bueno">Bueno</option>
        <option value="regular">Regular</option>
        <option value="reparacion">En reparación</option>
      </select>

      <div class="modal-acciones">
        <button type="button" class="btn btn-fantasma" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn-naranja">Guardar artículo</button>
      </div>
    </form>
  </div>
</div>

<div id="aviso" class="aviso" role="status" aria-live="polite"></div>
<script src="js/datos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
